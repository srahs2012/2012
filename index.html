<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SRAHS BATCH 12</title>
    <link rel="icon" href="https://i.postimg.cc/kXhnS1DX/logo.jpg" type="image/jpeg">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <style>
        :root { --primary-green: #65C15C; --bg-color: #F8F9FA; --text-dark: #2C3E50; --text-muted: #95A5A6; --white: #FFFFFF; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #000000; display: flex; justify-content: center; overscroll-behavior-y: none; }
        .app-wrapper { width: 100%; max-width: 430px; min-height: 100vh; background-color: var(--bg-color); position: relative; overflow-x: hidden; display: flex; flex-direction: column; }
        
        /* Splash Screen */
        #splash-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: var(--primary-green); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--white); font-size: 20px; font-weight: 900; text-align: center; padding: 20px; transition: opacity 0.5s ease, visibility 0.5s ease; }
        #splash-screen.hidden { opacity: 0; visibility: hidden; }
        .loading-bar-container { width: 80%; height: 6px; background-color: rgba(255, 255, 255, 0.3); border-radius: 10px; margin-top: 30px; overflow: hidden; }
        .loading-bar { height: 100%; width: 0%; background-color: var(--white); animation: fillBar 5s ease-out forwards; }
        @keyframes fillBar { 0% { width: 0%; } 100% { width: 100%; } }

        /* Header */
        header { position: sticky; top: 0; height: 60px; background-color: var(--primary-green); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 100; color: var(--white); }
        .hamburger { cursor: pointer; width: 24px; height: 24px; display: flex; align-items: center; }
        .header-title { font-size: 17px; font-weight: 800; letter-spacing: 1px; position: absolute; left: 50%; transform: translateX(-50%); }
        .lang-btn { color: var(--white); font-weight: bold; cursor: pointer; font-size: 14px; border: 1.5px solid var(--white); padding: 2px 8px; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
        
        /* Side Drawer Menu & Overlay */
        #menu-overlay { position: absolute; top: 60px; left: 0; width: 100%; height: calc(100vh - 60px); background: rgba(0,0,0,0.4); z-index: 85; opacity: 0; visibility: hidden; transition: opacity 0.3s ease; }
        #menu-overlay.active { opacity: 1; visibility: visible; }
        #side-drawer { position: absolute; top: 60px; left: 0; width: 250px; height: calc(100vh - 60px); background-color: var(--white); z-index: 90; transform: translateX(-100%); transition: transform 0.3s ease; box-shadow: 2px 0 10px rgba(0,0,0,0.05); padding-top: 20px; }
        #side-drawer.active { transform: translateX(0); }
        .menu-link { display: block; padding: 15px 24px; color: var(--text-dark); text-decoration: none; font-size: 16px; font-weight: bold; border-bottom: 1px solid #f0f0f0; }

        /* Main Content */
        #main-content { position: relative; flex: 1; padding-bottom: 20px; }
        .hero-bg { position: absolute; top: 0; left: 0; width: 100%; height: 200px; background-color: var(--primary-green); z-index: 1; transition: height 0.3s ease; }
        .view-container { position: relative; z-index: 10; padding: 24px; }
        .card { background: var(--white); border-radius: 16px; padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.06); margin-bottom: 15px; }
        
        .app-footer { padding: 20px 24px; background-color: var(--white); border-top: 1px solid #eaeaea; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; }
        
        .list-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #f0f0f0; }
        .list-row:last-child { border-bottom: none; padding-bottom: 0; }
        
        .back-btn { background: rgba(255,255,255,0.2); border: 1px solid white; color: white; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; display: flex; align-items: center; gap: 5px; }
        .header-spacer { width: 75px; } 
    </style>
</head>
<body>

    <div class="app-wrapper">
        <!-- Splash Screen with Logo -->
        <div id="splash-screen">
            <img src="https://i.postimg.cc/kXhnS1DX/logo.jpg" alt="Logo" style="width: 75px; height: 75px; border-radius: 50%; margin-bottom: 15px; object-fit: cover; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
            <div>WELCOME SRAHS BATCH 12 PROGRAM</div>
            <div class="loading-bar-container"><div class="loading-bar"></div></div>
        </div>
        
        <header>
            <div class="hamburger" id="menu-toggle">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 100%; height: 100%;"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </div>
            <div class="header-title">SRAHS BATCH 2012</div>
            <div class="lang-btn" onclick="toggleLang()">বাং</div>
        </header>

        <!-- Tap outside to close overlay -->
        <div id="menu-overlay"></div>

        <div id="side-drawer">
            <a href="#dashboard" class="menu-link" onclick="closeMenu(true)">Dashboard</a>
            <a href="#summary" class="menu-link" onclick="closeMenu(true)">Donation Summary</a>
            <a href="#villages" class="menu-link" onclick="closeMenu(true)">Village Directory</a>
            <a href="#gallery" class="menu-link" onclick="closeMenu(true)">Gallery</a>
            <a href="#about" class="menu-link" onclick="closeMenu(true)">About</a>
        </div>

        <main id="main-content"></main>

        <footer class="app-footer">
            <img src="https://i.postimg.cc/kXhnS1DX/logo.jpg" alt="Logo" style="width: 45px; height: 45px; border-radius: 50%; object-fit: cover;">
            <div>
                <p style="font-weight: bold; color: var(--primary-green); font-size: 13px;">&copy; 2026 SRAHS Batch 12</p>
                <p style="margin-top: 2px; color: var(--text-muted); font-size: 12px;">Shah Rahat Ali High School</p>
            </div>
        </footer>
    </div>

    <script>
        // --- Firebase Setup ---
        const firebaseConfig = {
            apiKey: "AIzaSyBJsv33wyCiAQnCnUff1FT6y2u0gyPzCk4",
            authDomain: "srahs-12.firebaseapp.com",
            databaseURL: "https://srahs-12-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "srahs-12",
            storageBucket: "srahs-12.firebasestorage.app",
            messagingSenderId: "221347457810",
            appId: "1:221347457810:web:79fd98b0ce9e0c394aa1cb"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let appData = { dashboard: { notice: {} }, members: {} };
        
        // Splash Screen Logic (Guaranteed 5-second wait)
        let minSplashTimePassed = false;
        let dataLoaded = false;
        let splashHidden = false;

        setTimeout(() => {
            minSplashTimePassed = true;
            checkAndHideSplash();
        }, 5000);

        function checkAndHideSplash() {
            if (minSplashTimePassed && dataLoaded && !splashHidden) {
                const splash = document.getElementById('splash-screen');
                if (splash) splash.classList.add('hidden');
                splashHidden = true;
            }
        }

        db.ref().on('value', (snapshot) => {
            const data = snapshot.val();
            if(data) {
                appData = data;
                if(!appData.members) appData.members = {};
            } else {
                appData = { dashboard: { notice: {} }, members: {} };
            }
            router(); 
            
            dataLoaded = true;
            checkAndHideSplash();
        });

        // --- UI & Menu Logic ---
        const menuToggle = document.getElementById('menu-toggle');
        const sideDrawer = document.getElementById('side-drawer');
        const menuOverlay = document.getElementById('menu-overlay');
        
        let returnToMenu = false; 

        menuToggle.addEventListener('click', () => {
            const isActive = sideDrawer.classList.toggle('active');
            menuOverlay.classList.toggle('active');
            if(isActive) {
                menuToggle.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 100%; height: 100%;"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>`;
                returnToMenu = false; 
            } else {
                menuToggle.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 100%; height: 100%;"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>`;
            }
        });

        menuOverlay.addEventListener('click', () => closeMenu(false));

        function closeMenu(fromLink = false) {
            sideDrawer.classList.remove('active');
            menuOverlay.classList.remove('active');
            menuToggle.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 100%; height: 100%;"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>`;
            if (fromLink) returnToMenu = true;
        }

        function goBack() {
            if (returnToMenu) {
                window.location.hash = '#dashboard';
                returnToMenu = false;
                
                setTimeout(() => {
                    sideDrawer.classList.add('active');
                    menuOverlay.classList.add('active');
                    menuToggle.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 100%; height: 100%;"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>`;
                }, 50);
            } else if (window.history.length > 2) {
                window.history.back();
            } else {
                window.location.hash = '#dashboard';
            }
        }

        let currentLang = 'en';
        const text = {
            en: {
                fundTitle: "Fund Overview", totalCol: "Total Collected", target: "Target per person: ৳1000",
                noticeTitle: "Latest Notice", toggleBtn: "বাং", menuDashboard: "Dashboard", menuSummary: "Donation Summary",
                menuVillages: "Village Directory", menuGallery: "Gallery", menuAbout: "About", membersCount: "Members", 
                noData: "Data updating...", backBtn: "Back", devInfo: "Developer Info", 
                devDesc: "Founder and Admin of this page."
            },
            bn: {
                fundTitle: "তহবিল ওভারভিউ", totalCol: "মোট সংগ্রহ", target: "জনপ্রতি লক্ষ্য: ৳১০০০",
                noticeTitle: "সর্বশেষ নোটিশ", toggleBtn: "EN", menuDashboard: "ড্যাশবোর্ড", menuSummary: "অনুদানের সারসংক্ষেপ",
                menuVillages: "গ্রামের তালিকা", menuGallery: "গ্যালারি", menuAbout: "সম্পর্কে", membersCount: "সদস্য", 
                noData: "তথ্য আপডেট হচ্ছে...", backBtn: "ফিরে যান", devInfo: "ডেভেলপার তথ্য", 
                devDesc: "এই পেজের প্রতিষ্ঠাতা ও অ্যাডমিন।"
            }
        };

        function toggleLang() {
            currentLang = currentLang === 'en' ? 'bn' : 'en';
            document.querySelector('.lang-btn').innerText = text[currentLang].toggleBtn;
            const menuLinks = document.querySelectorAll('.menu-link');
            menuLinks[0].innerText = text[currentLang].menuDashboard;
            menuLinks[1].innerText = text[currentLang].menuSummary;
            menuLinks[2].innerText = text[currentLang].menuVillages;
            menuLinks[3].innerText = text[currentLang].menuGallery;
            menuLinks[4].innerText = text[currentLang].menuAbout;
            router();
        }

        // --- Render Logic ---
        const mainContent = document.getElementById('main-content');
        function router() {
            const hash = window.location.hash || '#dashboard';
            if (hash === '#dashboard') renderDashboard();
            else if (hash === '#summary') renderSummary();
            else if (hash === '#villages') renderVillages();
            else if (hash === '#gallery') renderGallery();
            else if (hash === '#about') renderAbout();
        }

        function renderDashboard() {
            const t = text[currentLang];
            let totalAmount = 0;
            Object.values(appData.members).forEach(m => totalAmount += Number(m.amount || 0));

            const n = appData.dashboard?.notice?.[currentLang] || { date: '...', title: '...', body: '...' };

            mainContent.innerHTML = `
                <div class="hero-bg" style="height:200px;"></div>
                <div class="view-container">
                    <h2 style="color:white; margin-bottom:24px; text-align:center; font-size: 22px;">${t.fundTitle}</h2>
                    <div class="card" style="text-align:center;">
                        <h3 style="color:#95A5A6; font-size:13px; text-transform:uppercase; font-weight:700; letter-spacing:0.5px;">${t.totalCol}</h3>
                        <div style="font-size:38px; color:#65C15C; font-weight:900; margin:8px 0;">৳${totalAmount.toLocaleString()}</div>
                        <p style="font-size:13px; color:#95A5A6;">${t.target}</p>
                    </div>
                    <div style="text-align: center; margin: 40px 0 15px; font-size: 18px; font-weight: 800; color: var(--text-dark);">${t.noticeTitle}</div>
                    <div class="card" style="text-align: center;">
                        <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 6px;">${n.date}</div>
                        <h3 style="color: var(--primary-green); font-size: 16px; font-weight: 700; margin-bottom: 8px;">${n.title}</h3>
                        <p style="font-size: 14px; color: var(--text-dark); line-height: 1.5;">${n.body}</p>
                    </div>
                </div>
            `;
        }

        function renderSummary() {
            const t = text[currentLang];
            let listHTML = '';
            let count = 0;
            
            Object.values(appData.members).forEach(m => {
                count++;
                let amountNumber = Number(m.amount || 0);
                
                let statusIndicator = amountNumber > 0 
                    ? `<div style="font-weight:900; color:var(--primary-green); font-size:16px;">৳${amountNumber} <svg style="width:18px; height:18px; vertical-align:middle; margin-bottom:2px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></div>` 
                    : `<div style="color:var(--text-muted);"><svg style="width:20px; height:20px; vertical-align:middle; opacity:0.4;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle></svg></div>`;
                
                listHTML += `
                <div class="list-row">
                    <div>
                        <div style="font-weight:bold; color:var(--text-dark); font-size:15px;">${m.name}</div>
                        <div style="font-size:12px; color:var(--text-muted); margin-top:3px;">${m.village}</div>
                    </div>
                    ${statusIndicator}
                </div>`;
            });

            mainContent.innerHTML = `
                <div class="hero-bg" style="height:100px;"></div>
                <div class="view-container">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                        <button class="back-btn" onclick="goBack()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                            ${t.backBtn}
                        </button>
                        <h2 style="color:white; font-size: 18px; margin:0;">${t.menuSummary}</h2>
                        <div class="header-spacer"></div>
                    </div>
                    <div class="card">
                        <div style="text-align:center; font-size:12px; color:var(--text-muted); margin-bottom:15px; text-transform:uppercase; font-weight:bold;">${count} ${t.membersCount}</div>
                        ${listHTML || `<div style="text-align:center;">${t.noData}</div>`}
                    </div>
                </div>
            `;
        }

        function renderVillages() {
            const t = text[currentLang];
            let grouped = {};
            
            Object.values(appData.members).forEach(m => {
                if(!grouped[m.village]) grouped[m.village] = [];
                grouped[m.village].push(m);
            });

            let listHTML = '';
            Object.keys(grouped).sort().forEach(village => {
                listHTML += `
                <div class="card" style="padding:18px 20px; cursor:pointer; display:flex; justify-content:space-between; align-items:center;" onclick="showVillageDetail('${village.replace(/'/g, "\\'")}')">
                    <h3 style="color:var(--text-dark); font-size:16px; margin:0;">${village}</h3>
                    <div style="font-size:12px; color:var(--text-dark); font-weight:bold; background:#f0f0f0; padding:5px 12px; border-radius:12px;">${grouped[village].length} ${t.membersCount} &rarr;</div>
                </div>`;
            });

            mainContent.innerHTML = `
                <div class="hero-bg" style="height:100px;"></div>
                <div class="view-container">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                        <button class="back-btn" onclick="goBack()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                            ${t.backBtn}
                        </button>
                        <h2 style="color:white; font-size: 18px; margin:0;">${t.menuVillages}</h2>
                        <div class="header-spacer"></div>
                    </div>
                    ${listHTML || `<div class="card" style="text-align:center;">${t.noData}</div>`}
                </div>
            `;
        }

        window.showVillageDetail = function(villageName) {
            const t = text[currentLang];
            let grouped = {};
            Object.values(appData.members).forEach(m => {
                if(!grouped[m.village]) grouped[m.village] = [];
                grouped[m.village].push(m);
            });
            
            let members = grouped[villageName] || [];
            let membersList = members.map(m => {
                 let amt = Number(m.amount || 0);
                 let status = amt > 0 ? `<span style="font-size:14px; font-weight:800; color:var(--primary-green);">৳${amt}</span>` : `<svg style="width:18px; height:18px; color:var(--text-muted); opacity:0.4;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle></svg>`;
                 return `
                 <div class="list-row" style="padding: 12px 0;">
                    <span style="font-size:15px; font-weight:600; color:var(--text-dark);">${m.name}</span>
                    ${status}
                </div>`;
            }).join('');

            mainContent.innerHTML = `
                <div class="hero-bg" style="height:100px;"></div>
                <div class="view-container">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                        <button class="back-btn" onclick="renderVillages()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                            ${t.backBtn}
                        </button>
                        <h2 style="color:white; font-size: 18px; margin:0;">${villageName}</h2>
                        <div class="header-spacer"></div>
                    </div>
                    <div class="card" style="padding:10px 20px;">
                        ${membersList}
                    </div>
                </div>
            `;
        }

        function renderGallery() { 
            const t = text[currentLang];
            mainContent.innerHTML = `
                <div class="hero-bg" style="height:100px;"></div>
                <div class="view-container">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                        <button class="back-btn" onclick="goBack()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                            ${t.backBtn}
                        </button>
                        <h2 style="color:white; font-size: 18px; margin:0;">${t.menuGallery}</h2>
                        <div class="header-spacer"></div>
                    </div>
                    <div class="card" style="text-align:center; margin-top:20px;">Coming Soon...</div>
                </div>
            `; 
        }

        function renderAbout() {
            const t = text[currentLang];
            mainContent.innerHTML = `
                <div class="hero-bg" style="height:100px;"></div>
                <div class="view-container">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                        <button class="back-btn" onclick="goBack()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                            ${t.backBtn}
                        </button>
                        <h2 style="color:white; font-size: 18px; margin:0;">${t.menuAbout}</h2>
                        <div class="header-spacer"></div>
                    </div>
                    <div class="card" style="text-align:center; padding: 40px 20px;">
                        <div style="width:80px; height:80px; background-color:var(--primary-green); color:white; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:32px; font-weight:bold; margin:0 auto 15px; box-shadow: 0 4px 10px rgba(101,193,92,0.3);">
                            SI
                        </div>
                        <h3 style="color:var(--text-dark); font-size:20px; margin-bottom:5px; font-weight:900;">SHARIFUL ISLAM</h3>
                        <div style="color:var(--primary-green); font-size:12px; font-weight:bold; text-transform:uppercase; letter-spacing:1px; margin-bottom:15px;">
                            ${t.devInfo}
                        </div>
                        <p style="font-size:14px; color:var(--text-muted); line-height:1.6; max-width: 250px; margin: 0 auto;">
                            ${t.devDesc}
                        </p>
                    </div>
                </div>
            `;
        }

        window.addEventListener('hashchange', router);
        window.addEventListener('load', router);
    </script>
</body>
</html>
