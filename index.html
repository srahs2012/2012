<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SRAHS BATCH 12</title>
    <link rel="icon" href="https://i.postimg.cc/kXhnS1DX/logo.jpg" type="image/jpeg">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <style>
        :root { --primary-green: #65C15C; --bg-color: #F8F9FA; --text-dark: #2C3E50; --text-muted: #95A5A6; --white: #FFFFFF; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        html, body { height: 100%; overflow: hidden; background-color: #000000; }
        body { display: flex; justify-content: center; }
        
        .app-wrapper { width: 100%; max-width: 430px; height: 100%; max-height: 100%; background-color: var(--bg-color); position: relative; overflow: hidden; display: flex; flex-direction: column; }
        
        /* Splash Screen */
        #splash-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: var(--primary-green); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--white); font-size: 20px; font-weight: 900; text-align: center; padding: 20px; transition: opacity 0.5s ease, visibility 0.5s ease; }
        #splash-screen.hidden { opacity: 0; visibility: hidden; }
        .loading-bar-container { width: 80%; height: 6px; background-color: rgba(255, 255, 255, 0.3); border-radius: 10px; margin-top: 30px; overflow: hidden; }
        .loading-bar { height: 100%; width: 0%; background-color: var(--white); animation: fillBar 5s ease-out forwards; }
        @keyframes fillBar { 0% { width: 0%; } 100% { width: 100%; } }

        /* Header & Nav */
        header { position: sticky; top: 0; height: 60px; min-height: 60px; background-color: var(--primary-green); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 100; color: var(--white); }
        .hamburger { cursor: pointer; width: 24px; height: 24px; display: flex; align-items: center; }
        .header-title { font-size: 17px; font-weight: 800; letter-spacing: 1px; position: absolute; left: 50%; transform: translateX(-50%); }
        
        .lang-btn { color: var(--white); font-weight: bold; cursor: pointer; font-size: 14px; border: 1.5px solid var(--white); padding: 2px 8px; border-radius: 6px; display: flex; align-items: center; justify-content: center; transition: transform 0.2s ease; }
        .lang-btn:active { transform: scale(0.90); }

        .back-btn { background: rgba(255,255,255,0.2); border: 1px solid white; color: white; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.2s ease, background 0.2s ease; }
        .back-btn:active { transform: scale(0.90); background: rgba(255,255,255,0.4); }
        .header-spacer { width: 36px; } 
        
        #menu-overlay { position: absolute; top: 60px; left: 0; width: 100%; height: calc(100% - 60px); background: rgba(0,0,0,0.4); z-index: 85; opacity: 0; visibility: hidden; transition: opacity 0.3s ease; }
        #menu-overlay.active { opacity: 1; visibility: visible; }
        #side-drawer { position: absolute; top: 60px; left: 0; width: 250px; height: calc(100% - 60px); background-color: var(--white); z-index: 90; transform: translateX(-100%); transition: transform 0.3s ease; box-shadow: 2px 0 10px rgba(0,0,0,0.05); padding-top: 10px; }
        #side-drawer.active { transform: translateX(0); }
        
        .menu-link { display: block; padding: 15px 24px; color: var(--text-dark); text-decoration: none; font-size: 16px; font-weight: bold; border-bottom: 1px solid #f0f0f0; border-left: 4px solid transparent; transition: all 0.2s ease; }
        .menu-link:active { background-color: rgba(101,193,92,0.1); }
        .menu-link.active-nav { color: var(--primary-green); background-color: rgba(101, 193, 92, 0.08); border-left-color: var(--primary-green); padding-left: 20px; }

        /* Main Content */
        #main-content { position: relative; flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding-bottom: 15px; }
        .hero-bg { position: absolute; top: 0; left: 0; width: 100%; height: 180px; background-color: var(--primary-green); z-index: 1; transition: height 0.3s ease; }
        .view-container { position: relative; z-index: 10; padding: 15px 20px; }
        .card { background: var(--white); border-radius: 16px; padding: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.06); margin-bottom: 12px; }
        
        .app-footer { padding: 15px 20px; background-color: var(--white); border-top: 1px solid #eaeaea; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; }
        .list-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #f0f0f0; }
        .list-row:last-child { border-bottom: none; padding-bottom: 0; }
        
        /* Buttons */
        .dash-action-btn { display: block; width: 100%; text-align: center; background: var(--primary-green); color: white; padding: 14px; border-radius: 12px; text-decoration: none; font-weight: 800; font-size: 15px; margin-top: 8px; border: none; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 4px 12px rgba(101,193,92,0.3); }
        .dash-action-btn:hover, .dash-action-btn:active { transform: scale(0.95); box-shadow: 0 2px 8px rgba(101,193,92,0.4); }
        
        .btn-gold { background: #F39C12; box-shadow: 0 4px 12px rgba(243,156,18,0.3); }
        .btn-gold:hover, .btn-gold:active { box-shadow: 0 2px 8px rgba(243,156,18,0.4); }
        .btn-gray { background: #95A5A6 !important; box-shadow: none !important; cursor: not-allowed; }

        /* Crest Modal (Bottom Sheet) */
        #crest-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); z-index: 150; opacity: 0; visibility: hidden; transition: 0.3s; }
        #crest-overlay.active { opacity: 1; visibility: visible; }
        #crest-modal { position: absolute; bottom: -100%; left: 0; width: 100%; background: var(--white); border-radius: 20px 20px 0 0; z-index: 200; padding: 25px 20px; transition: bottom 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 -5px 15px rgba(0,0,0,0.1); }
        #crest-modal.active { bottom: 0; }
        .crest-input { width: 100%; padding: 14px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 10px; font-size: 15px; outline: none; }
        .crest-input:focus { border-color: var(--primary-green); }

        /* Image & Gallery */
        .dash-feature-img { width: 100%; border-radius: 12px; margin-top: 15px; margin-bottom: 5px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); object-fit: cover; cursor: pointer; }
        .gallery-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 10px; }
        .album-photo { background: white; padding: 8px 8px 30px 8px; border-radius: 4px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); transition: transform 0.3s ease, box-shadow 0.3s ease; cursor: pointer; }
        .album-photo img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 2px; }
        .album-photo:active { transform: translateY(-3px) scale(1.02); box-shadow: 0 8px 16px rgba(0,0,0,0.15); }

        /* Full Screen Lightbox */
        #lightbox { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 99999; display: flex; align-items: center; justify-content: center; opacity: 0; visibility: hidden; transition: opacity 0.3s ease, visibility 0.3s ease; backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); overflow: hidden; }
        #lightbox.active { opacity: 1; visibility: visible; }
        .lightbox-toolbar { position: absolute; top: 0; left: 0; width: 100%; padding: 20px; display: flex; justify-content: space-between; align-items: center; z-index: 100000; }
        .lightbox-action-btn { background: rgba(0,0,0,0.5); border: none; color: white; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; backdrop-filter: blur(4px); transition: transform 0.2s ease, background 0.2s ease; }
        .lightbox-action-btn:active { background: rgba(255,255,255,0.2); transform: scale(0.90); }
        #lightbox-img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; opacity: 0; transform-origin: center center; transition: opacity 0.3s ease; touch-action: none; }
        #lightbox.active #lightbox-img { opacity: 1; }

        /* Native Print & PDF Generator Styles */
        #print-area { display: none; }
        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { position: absolute; left: 0; top: 0; width: 100%; padding: 20px; display: block !important; }
            .app-wrapper, #lightbox, #crest-modal { display: none !important; }
        }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <div id="splash-screen">
            <img src="https://i.postimg.cc/kXhnS1DX/logo.jpg" alt="Logo" style="width: 75px; height: 75px; border-radius: 50%; margin-bottom: 15px; object-fit: cover; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
            <div>WELCOME SRAHS BATCH 12 PROGRAM</div>
            <div class="loading-bar-container"><div class="loading-bar"></div></div>
        </div>
        
        <header>
            <div class="hamburger" id="menu-toggle">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 100%; height: 100%;"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </div>
            <div class="header-title">SRAHS 12 BATCH</div>
            <div class="lang-btn" onclick="toggleLang()">EN</div>
        </header>

        <div id="menu-overlay"></div>

        <div id="side-drawer">
            <a href="#dashboard" class="menu-link" onclick="closeMenu(true)"></a>
            <a href="#summary" class="menu-link" onclick="closeMenu(true)"></a>
            <a href="#villages" class="menu-link" onclick="closeMenu(true)"></a>
            <a href="#gallery" class="menu-link" onclick="closeMenu(true)"></a>
            <a href="#about" class="menu-link" onclick="closeMenu(true)"></a>
        </div>

        <main id="main-content"></main>

        <footer class="app-footer">
            <img src="https://i.postimg.cc/kXhnS1DX/logo.jpg" alt="Logo" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover;">
            <div>
                <p style="font-weight: bold; color: var(--primary-green); font-size: 12px;">&copy; 2026 SRAHS Batch 12</p>
                <p style="margin-top: 4px; color: var(--text-dark); font-size: 11px; font-weight: 800; letter-spacing: 0.5px;">SHAH RAHAT ALI HIGH SCHOOL</p>
            </div>
        </footer>
        
        <!-- Crest Modal Bottom Sheet -->
        <div id="crest-overlay" onclick="closeCrestModal()"></div>
        <div id="crest-modal">
            <div style="width:40px; height:5px; background:#ddd; border-radius:10px; margin:0 auto 15px;"></div>
            <h3 id="crest-modal-title" style="color:var(--text-dark); font-size:16px; margin-bottom:15px; text-align:center; font-weight:800;"></h3>
            <input type="text" id="crest-name" class="crest-input">
            <input type="text" id="crest-village" class="crest-input">
            <button class="dash-action-btn" id="crest-submit-btn" onclick="submitCrestData()"></button>
        </div>
    </div>

    <!-- Hidden Print Area for Native PDF -->
    <div id="print-area"></div>

    <!-- Lightbox Overlay -->
    <div id="lightbox">
        <div class="lightbox-toolbar">
            <a id="lightbox-dl" href="#" target="_blank" class="lightbox-action-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:20px;height:20px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            </a>
            <button class="lightbox-action-btn" onclick="closeLightbox()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:24px;height:24px;"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        <img id="lightbox-img" src="" alt="Full View">
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBJsv33wyCiAQnCnUff1FT6y2u0gyPzCk4",
            authDomain: "srahs-12.firebaseapp.com",
            databaseURL: "https://srahs-12-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "srahs-12",
            storageBucket: "srahs-12.firebasestorage.app",
            messagingSenderId: "221347457810",
            appId: "1:221347457810:web:79fd98b0ce9e0c394aa1cb"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let appData = { dashboard: { notice: {}, featureImage: '' }, members: {}, gallery: {} };
        
        let minSplashTimePassed = false;
        let dataLoaded = false;
        let splashHidden = false;

        setTimeout(() => { minSplashTimePassed = true; checkAndHideSplash(); }, 5000);

        function checkAndHideSplash() {
            if (minSplashTimePassed && dataLoaded && !splashHidden) {
                const splash = document.getElementById('splash-screen');
                if (splash) splash.classList.add('hidden');
                splashHidden = true;
            }
        }

        db.ref().on('value', (snapshot) => {
            const data = snapshot.val();
            if(data) {
                appData = data;
                if(!appData.members) appData.members = {};
                if(!appData.gallery) appData.gallery = {};
                if(!appData.dashboard) appData.dashboard = {};
            } else {
                appData = { dashboard: { notice: {} }, members: {}, gallery: {} };
            }
            router(); 
            dataLoaded = true; checkAndHideSplash();
        });

        const menuToggle = document.getElementById('menu-toggle');
        const sideDrawer = document.getElementById('side-drawer');
        const menuOverlay = document.getElementById('menu-overlay');
        let returnToMenu = false; 

        menuToggle.addEventListener('click', () => {
            const isActive = sideDrawer.classList.toggle('active');
            menuOverlay.classList.toggle('active');
            if(isActive) {
                menuToggle.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 100%; height: 100%;"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>`;
                returnToMenu = false; 
            } else {
                menuToggle.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 100%; height: 100%;"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>`;
            }
        });

        menuOverlay.addEventListener('click', () => closeMenu(false));

        function closeMenu(fromLink = false) {
            sideDrawer.classList.remove('active');
            menuOverlay.classList.remove('active');
            menuToggle.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 100%; height: 100%;"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>`;
            if (fromLink) returnToMenu = true;
        }

        function goBack() {
            if (returnToMenu) {
                window.location.hash = '#dashboard';
                returnToMenu = false;
                setTimeout(() => {
                    sideDrawer.classList.add('active'); menuOverlay.classList.add('active');
                    menuToggle.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 100%; height: 100%;"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>`;
                }, 50);
            } else if (window.history.length > 2) {
                window.history.back();
            } else {
                window.location.hash = '#dashboard';
            }
        }

        // --- Lightbox & Pinch Zoom Logic ---
        let currentScale = 1; let initialDistance = 0; let currentX = 0, currentY = 0; let initialX = 0, initialY = 0;
        const lbImg = document.getElementById('lightbox-img');

        function openLightbox(src) {
            const lightbox = document.getElementById('lightbox');
            lbImg.src = src; document.getElementById('lightbox-dl').href = src; 
            currentScale = 1; currentX = 0; currentY = 0;
            lbImg.style.transform = `translate(0px, 0px) scale(1)`;
            lightbox.classList.add('active');
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            setTimeout(() => { lbImg.src = ''; }, 300);
        }

        lbImg.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) initialDistance = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
            else if (e.touches.length === 1) { initialX = e.touches[0].pageX - currentX; initialY = e.touches[0].pageY - currentY; }
        });

        lbImg.addEventListener('touchmove', (e) => {
            e.preventDefault(); 
            if (e.touches.length === 2) {
                let newDistance = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                currentScale = Math.min(Math.max(1, currentScale * (newDistance / initialDistance)), 4); 
                initialDistance = newDistance;
            } else if (e.touches.length === 1 && currentScale > 1) {
                currentX = e.touches[0].pageX - initialX; currentY = e.touches[0].pageY - initialY;
            }
            lbImg.style.transform = `translate(${currentX}px, ${currentY}px) scale(${currentScale})`;
        });

        // --- Language Config ---
        let currentLang = 'bn'; 
        const text = {
            en: {
                fundTitle: "Fund Overview", totalCol: "Total Collected", target: "Target per person: ৳1000",
                noticeTitle: "Latest Notice", toggleBtn: "বাং", menuDashboard: "Dashboard", menuSummary: "Donation Summary",
                menuVillages: "Village Directory", menuGallery: "Gallery", menuAbout: "About", membersCount: "Members", 
                noData: "Data updating...", viewGalleryBtn: "View Photo Gallery",
                crestBtn: "Submit Crest Name", crestListBtn: "Download PDF List", 
                crestPrompt: "Please write your exact name for the crest:", crestNamePlace: "Your Name", crestVillagePlace: "Village Name", crestSubmit: "Submit Name", crestDone: "Name Already Submitted"
            },
            bn: {
                fundTitle: "তহবিল ওভারভিউ", totalCol: "মোট সংগ্রহ", target: "জনপ্রতি লক্ষ্য: ৳১০০০",
                noticeTitle: "সর্বশেষ নোটিশ", toggleBtn: "EN", menuDashboard: "ড্যাশবোর্ড", menuSummary: "অনুদানের সারসংক্ষেপ",
                menuVillages: "গ্রামের তালিকা", menuGallery: "গ্যালারি", menuAbout: "সম্পর্কে", membersCount: "সদস্য", 
                noData: "তথ্য আপডেট হচ্ছে...", viewGalleryBtn: "ফটো গ্যালারি দেখুন",
                crestBtn: "ক্রেস্টের নাম জমা দিন", crestListBtn: "পিডিএফ তালিকা ডাউনলোড", 
                crestPrompt: "ক্রেস্টের জন্য আপনার সঠিক নামটি লিখুন:", crestNamePlace: "আপনার নাম", crestVillagePlace: "গ্রামের নাম", crestSubmit: "জমা দিন", crestDone: "নাম জমা দেওয়া হয়েছে"
            }
        };

        function updateLanguageUI() {
            document.querySelector('.lang-btn').innerText = text[currentLang].toggleBtn;
            const menuLinks = document.querySelectorAll('.menu-link');
            menuLinks[0].innerText = text[currentLang].menuDashboard;
            menuLinks[1].innerText = text[currentLang].menuSummary;
            menuLinks[2].innerText = text[currentLang].menuVillages;
            menuLinks[3].innerText = text[currentLang].menuGallery;
            menuLinks[4].innerText = text[currentLang].menuAbout;
            
            // Update Modal UI
            document.getElementById('crest-modal-title').innerText = text[currentLang].crestPrompt;
            document.getElementById('crest-name').placeholder = text[currentLang].crestNamePlace;
            document.getElementById('crest-village').placeholder = text[currentLang].crestVillagePlace;
            document.getElementById('crest-submit-btn').innerText = text[currentLang].crestSubmit;
            
            router();
        }

        function toggleLang() {
            currentLang = currentLang === 'en' ? 'bn' : 'en';
            updateLanguageUI();
        }

        // --- Crest Logic ---
        function openCrestModal() {
            document.getElementById('crest-overlay').classList.add('active');
            document.getElementById('crest-modal').classList.add('active');
        }

        function closeCrestModal() {
            document.getElementById('crest-overlay').classList.remove('active');
            document.getElementById('crest-modal').classList.remove('active');
        }

        function submitCrestData() {
            const name = document.getElementById('crest-name').value;
            const village = document.getElementById('crest-village').value;
            if(!name || !village) return alert("Please fill both Name and Village.");
            
            document.getElementById('crest-submit-btn').innerText = "Submitting...";
            
            db.ref('crest_names').push({ name: name, village: village, timestamp: Date.now() })
                .then(() => {
                    localStorage.setItem('crestSubmitted', 'true');
                    closeCrestModal();
                    router(); // Refresh dashboard to update button state
                    alert(currentLang === 'en' ? "Successfully Submitted!" : "সফলভাবে জমা হয়েছে!");
                })
                .catch(e => {
                    alert("Error: " + e.message);
                    document.getElementById('crest-submit-btn').innerText = text[currentLang].crestSubmit;
                });
        }

        function downloadCrestList() {
            db.ref('crest_names').once('value').then(snap => {
                const data = snap.val();
                if(!data) return alert("No names submitted yet.");
                
                let html = `<h2 style="text-align:center; margin-bottom:20px;">SRAHS Batch 12 - Crest Names</h2>`;
                html += `<table style="width:100%; border-collapse: collapse; font-family: sans-serif;">
                            <tr style="background:#f2f2f2;">
                                <th style="border:1px solid #ddd; padding:8px; text-align:left;">#</th>
                                <th style="border:1px solid #ddd; padding:8px; text-align:left;">Name</th>
                                <th style="border:1px solid #ddd; padding:8px; text-align:left;">Village</th>
                            </tr>`;
                
                let i = 1;
                Object.values(data).forEach(entry => {
                    html += `<tr>
                                <td style="border:1px solid #ddd; padding:8px;">${i++}</td>
                                <td style="border:1px solid #ddd; padding:8px; font-weight:bold;">${entry.name}</td>
                                <td style="border:1px solid #ddd; padding:8px;">${entry.village}</td>
                             </tr>`;
                });
                html += `</table>`;
                
                document.getElementById('print-area').innerHTML = html;
                window.print();
            });
        }

        const mainContent = document.getElementById('main-content');
        
        function router() {
            const hash = window.location.hash || '#dashboard';
            document.querySelectorAll('.menu-link').forEach(link => {
                if(link.getAttribute('href') === hash) link.classList.add('active-nav');
                else link.classList.remove('active-nav');
            });

            if (hash === '#dashboard') renderDashboard();
            else if (hash === '#summary') renderSummary();
            else if (hash === '#villages') renderVillages();
            else if (hash === '#gallery') renderGallery();
            else if (hash === '#about') renderAbout();
        }

        function renderDashboard() {
            const t = text[currentLang];
            let totalAmount = 0;
            Object.values(appData.members).forEach(m => totalAmount += Number(m.amount || 0));

            const n = appData.dashboard?.notice?.[currentLang] || { date: '...', title: '...', body: '...' };
            
            let featureImageHTML = '';
            if (appData.dashboard?.featureImage) {
                featureImageHTML = `<img src="${appData.dashboard.featureImage}" class="dash-feature-img" alt="Reunion Featured Image" onclick="openLightbox('${appData.dashboard.featureImage}')">`;
            }

            // Check if user already submitted a crest name
            const isSubmitted = localStorage.getItem('crestSubmitted');
            const crestBtnHTML = isSubmitted 
                ? `<button class="dash-action-btn btn-gray" disabled>${t.crestDone}</button>`
                : `<button class="dash-action-btn btn-gold" onclick="openCrestModal()">${t.crestBtn}</button>`;

            mainContent.innerHTML = `
                <div class="hero-bg" style="height:180px;"></div>
                <div class="view-container">
                    <h2 style="color:white; margin-bottom:20px; text-align:center; font-size: 20px;">${t.fundTitle}</h2>
                    <div class="card" style="text-align:center;">
                        <h3 style="color:#95A5A6; font-size:12px; text-transform:uppercase; font-weight:700; letter-spacing:0.5px;">${t.totalCol}</h3>
                        <div style="font-size:34px; color:#65C15C; font-weight:900; margin:6px 0;">৳${totalAmount.toLocaleString()}</div>
                        <p style="font-size:12px; color:#95A5A6;">${t.target}</p>
                    </div>
                    <div style="text-align: center; margin: 25px 0 10px; font-size: 17px; font-weight: 800; color: var(--text-dark);">${t.noticeTitle}</div>
                    <div class="card" style="text-align: center;">
                        <div style="font-size: 11px; color: var(--text-muted); margin-bottom: 6px;">${n.date}</div>
                        <h3 style="color: var(--primary-green); font-size: 15px; font-weight: 700; margin-bottom: 6px;">${n.title}</h3>
                        <p style="font-size: 13px; color: var(--text-dark); line-height: 1.5;">${n.body}</p>
                    </div>
                    
                    <div style="display:flex; gap:10px; margin-top: 25px;">
                        ${crestBtnHTML}
                        <button class="dash-action-btn" style="background:#3498db; width: auto; padding: 14px 15px;" onclick="downloadCrestList()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:20px;height:20px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                        </button>
                    </div>

                    ${featureImageHTML}
                    <button class="dash-action-btn" onclick="window.location.hash='#gallery'">${t.viewGalleryBtn}</button>
                </div>
            `;
        }

        function renderSummary() {
            const t = text[currentLang];
            let listHTML = ''; let count = 0;
            Object.values(appData.members).forEach(m => {
                count++;
                let amountNumber = Number(m.amount || 0);
                let statusIndicator = amountNumber > 0 
                    ? `<div style="font-weight:900; color:var(--primary-green); font-size:16px;">৳${amountNumber} <svg style="width:18px; height:18px; vertical-align:middle; margin-bottom:2px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></div>` 
                    : `<div style="color:var(--text-muted);"><svg style="width:20px; height:20px; vertical-align:middle; opacity:0.4;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle></svg></div>`;
                listHTML += `<div class="list-row"><div><div style="font-weight:bold; color:var(--text-dark); font-size:15px;">${m.name}</div><div style="font-size:12px; color:var(--text-muted); margin-top:3px;">${m.village}</div></div>${statusIndicator}</div>`;
            });

            mainContent.innerHTML = `<div class="hero-bg" style="height:100px;"></div><div class="view-container"><div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;"><button class="back-btn" onclick="goBack()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:20px;height:20px;"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg></button><h2 style="color:white; font-size: 18px; margin:0;">${t.menuSummary}</h2><div class="header-spacer"></div></div><div class="card"><div style="text-align:center; font-size:12px; color:var(--text-muted); margin-bottom:15px; text-transform:uppercase; font-weight:bold;">${count} ${t.membersCount}</div>${listHTML || `<div style="text-align:center;">${t.noData}</div>`}</div></div>`;
        }

        function renderVillages() {
            const t = text[currentLang];
            let grouped = {};
            Object.values(appData.members).forEach(m => { if(!grouped[m.village]) grouped[m.village] = []; grouped[m.village].push(m); });
            let listHTML = '';
            Object.keys(grouped).sort().forEach(village => {
                listHTML += `<div class="card" style="padding:16px; cursor:pointer; display:flex; justify-content:space-between; align-items:center;" onclick="showVillageDetail('${village.replace(/'/g, "\\'")}')"><h3 style="color:var(--text-dark); font-size:15px; margin:0;">${village}</h3><div style="font-size:12px; color:var(--text-dark); font-weight:bold; background:#f0f0f0; padding:5px 12px; border-radius:12px;">${grouped[village].length} ${t.membersCount} &rarr;</div></div>`;
            });
            mainContent.innerHTML = `<div class="hero-bg" style="height:100px;"></div><div class="view-container"><div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;"><button class="back-btn" onclick="goBack()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:20px;height:20px;"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg></button><h2 style="color:white; font-size: 18px; margin:0;">${t.menuVillages}</h2><div class="header-spacer"></div></div>${listHTML || `<div class="card" style="text-align:center;">${t.noData}</div>`}</div>`;
        }

        window.showVillageDetail = function(villageName) {
            const t = text[currentLang];
            let grouped = {};
            Object.values(appData.members).forEach(m => { if(!grouped[m.village]) grouped[m.village] = []; grouped[m.village].push(m); });
            let membersList = (grouped[villageName] || []).map(m => {
                 let amt = Number(m.amount || 0);
                 let status = amt > 0 ? `<span style="font-size:14px; font-weight:800; color:var(--primary-green);">৳${amt}</span>` : `<svg style="width:18px; height:18px; color:var(--text-muted); opacity:0.4;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle></svg>`;
                 return `<div class="list-row" style="padding: 12px 0;"><span style="font-size:15px; font-weight:600; color:var(--text-dark);">${m.name}</span>${status}</div>`;
            }).join('');
            mainContent.innerHTML = `<div class="hero-bg" style="height:100px;"></div><div class="view-container"><div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;"><button class="back-btn" onclick="renderVillages()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:20px;height:20px;"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg></button><h2 style="color:white; font-size: 18px; margin:0;">${villageName}</h2><div class="header-spacer"></div></div><div class="card" style="padding:10px 20px;">${membersList}</div></div>`;
        }

        function renderGallery() { 
            const t = text[currentLang];
            let photosHTML = '';
            if(appData.gallery) {
                Object.values(appData.gallery).forEach(photo => {
                    photosHTML += `<div class="album-photo" onclick="openLightbox('${photo.url}')"><img src="${photo.url}" alt="Gallery Photo"></div>`;
                });
            }
            if (!photosHTML) photosHTML = `<div style="grid-column: 1 / -1; text-align:center; padding: 30px; font-size: 14px; font-weight: bold; color: var(--text-muted);">${t.noData}</div>`;
            
            mainContent.innerHTML = `<div class="hero-bg" style="height:100px;"></div><div class="view-container"><div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;"><button class="back-btn" onclick="goBack()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:20px;height:20px;"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg></button><h2 style="color:white; font-size: 18px; margin:0;">${t.menuGallery}</h2><div class="header-spacer"></div></div><div class="gallery-grid">${photosHTML}</div></div>`; 
        }

        function renderAbout() {
            const t = text[currentLang];
            mainContent.innerHTML = `<div class="hero-bg" style="height:100px;"></div><div class="view-container"><div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;"><button class="back-btn" onclick="goBack()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:20px;height:20px;"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg></button><h2 style="color:white; font-size: 18px; margin:0;">${t.menuAbout}</h2><div class="header-spacer"></div></div><div class="card" style="text-align:center; padding: 40px 20px;"><div style="width:80px; height:80px; background-color:var(--primary-green); color:white; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:32px; font-weight:bold; margin:0 auto 15px; box-shadow: 0 4px 10px rgba(101,193,92,0.3);">SI</div><div style="color:var(--text-muted); font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:1.5px; margin-bottom:10px;">Developer Info</div><h3 style="color:var(--text-dark); font-size:22px; margin-bottom:4px; font-weight:900; letter-spacing:0.5px;">SHARIFUL ISLAM</h3><div style="color:var(--primary-green); font-size:13px; font-weight:900; text-transform:uppercase; letter-spacing:1px; margin-bottom:0;">Founder & Admin</div></div></div>`;
        }

        window.addEventListener('load', () => { updateLanguageUI(); });
        window.addEventListener('hashchange', router);
    </script>
</body>
</html>
